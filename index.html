<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Heart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #04030a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      width: min(96vw, 96vh);
      height: min(96vw, 96vh);
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas" width="1000" height="1000"></canvas>

  <script>
    const PHRASES = [
      "I love you",
      "Я тебе люблю",
      "愛してる"
    ];

    const COLORS = [
      "rgba(245, 238, 255, 0.92)",
      "rgba(218, 195, 255, 0.85)",
      "rgba(186, 150, 255, 0.78)",
      "rgba(155, 115, 250, 0.70)",
      "rgba(255, 255, 255, 0.95)"
    ];

    const DURATION = 4800; // мс (1 прохід)
    const POP_WINDOW = 220; // мс — підсвітка щойно з'явленої фрази як на відео

    // Форма серця як на 2-му фото: пологий верх з легкою виїмкою і звуження донизу
    function isInHeart(nx, ny) {
      const ax = Math.abs(nx);
      if (ax > 1.0) return false;

      const topDip = 0.24 * Math.exp(-Math.pow(nx * 3.8, 2));
      const shoulder = 0.76 - topDip - 0.14 * Math.pow(ax, 2.2);
      const bottomTip = -0.92 + 0.96 * Math.pow(ax, 0.86);

      return ny <= shoulder && ny >= bottomTip;
    }

    function createRng(seed = 2026) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    const SIZE = 1000;
    const CX = SIZE * 0.5;
    const CY = SIZE * 0.50;
    const SCALE_X = SIZE * 0.39;
    const SCALE_Y = SIZE * 0.41;

    const rng = createRng(2026);
    const items = [];

    const TOTAL_ITEMS = 2500;
    let attempts = 0;

    while (items.length < TOTAL_ITEMS && attempts < 38000) {
      attempts++;
      const text = PHRASES[Math.floor(rng() * PHRASES.length)];
      const color = COLORS[Math.floor(rng() * COLORS.length)];
      const fontSize = Math.floor(8 + rng() * 5);

      const rx = rng() * 2.1 - 1.05;
      const ry = rng() * 2.1 - 1.05;
      if (!isInHeart(rx, ry)) continue;

      const px = CX + rx * SCALE_X - fontSize * 2.1;
      const py = CY - ry * SCALE_Y - fontSize * 0.5;

      const approxW = text.length * fontSize * 0.56;
      const rxRight = (px + approxW - CX) / SCALE_X;
      if (!isInHeart(rxRight, ry) && rng() > 0.25) continue;

      // Кут і відстань від центру для появи спочатку по краях, потім усередині
      const angle = (Math.atan2(-ry, rx) + Math.PI) / (Math.PI * 2);
      const dist = Math.hypot(rx, ry);
      const isEdge = dist > 0.68;

      const orderKey = isEdge
        ? angle * 0.46 + rng() * 0.05
        : 0.46 + (1 - dist) * 0.44 + rng() * 0.1;

      items.push({ x: px, y: py, text, color, fontSize, orderKey });
    }

    items.sort((a, b) => a.orderKey - b.orderKey);
    for (let i = 0; i < items.length; i++) {
      items[i].appearAt = (i / items.length) * DURATION;
    }

    // Попередньо рендеримо шар м'якого фіолетового світіння
    const glowCanvas = document.createElement("canvas");
    glowCanvas.width = SIZE;
    glowCanvas.height = SIZE;
    const gCtx = glowCanvas.getContext("2d");

    gCtx.save();
    gCtx.filter = "blur(26px)";
    gCtx.fillStyle = "rgba(120, 75, 255, 0.85)";
    for (let i = 0; i < items.length; i += 3) {
      const it = items[i];
      gCtx.fillRect(it.x, it.y, it.text.length * it.fontSize * 0.55, it.fontSize);
    }
    gCtx.restore();

    // Базовий шар уже закріплених фраз
    const settledCanvas = document.createElement("canvas");
    settledCanvas.width = SIZE;
    settledCanvas.height = SIZE;
    const sCtx = settledCanvas.getContext("2d");
    sCtx.textBaseline = "top";
    sCtx.shadowColor = "rgba(155, 110, 255, 0.75)";
    sCtx.shadowBlur = 6;

    let settledIndex = 0;
    const startTime = performance.now();

    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / DURATION);

      // Закріплюємо фрази, спалах яких уже завершився
      while (
        settledIndex < items.length &&
        elapsed - items[settledIndex].appearAt >= POP_WINDOW
      ) {
        const it = items[settledIndex];
        sCtx.font = `600 ${it.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif`;
        sCtx.fillStyle = it.color;
        sCtx.fillText(it.text, it.x, it.y);
        settledIndex++;
      }

      ctx.fillStyle = "#04030a";
      ctx.fillRect(0, 0, SIZE, SIZE);

      // Фіолетове світіння наростає разом із появою серця
      ctx.save();
      ctx.globalAlpha = 0.2 + 0.8 * progress;
      ctx.drawImage(glowCanvas, 0, 0);
      ctx.restore();

      // Закріплені фрази
      ctx.drawImage(settledCanvas, 0, 0);

      // Свіжі фрази з легким спалахом появи як на відео
      ctx.save();
      ctx.textBaseline = "top";
      ctx.shadowColor = "rgba(210, 180, 255, 0.95)";
      ctx.shadowBlur = 12;

      for (let i = settledIndex; i < items.length; i++) {
        const it = items[i];
        if (elapsed < it.appearAt) break;

        const age = elapsed - it.appearAt;
        const pop = 1 - Math.min(1, age / POP_WINDOW);
        ctx.font = `600 ${it.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif`;
        ctx.fillStyle = pop > 0.35 ? "#ffffff" : it.color;
        ctx.fillText(it.text, it.x, it.y);
      }
      ctx.restore();

      if (progress < 1 || settledIndex < items.length) {
        requestAnimationFrame(animate);
      }
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
