<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Heart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #04030a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      width: min(96vw, 96vh);
      height: min(96vw, 96vh);
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas" width="1000" height="1000"></canvas>

  <script>
    const PHRASES = [
      "I love you",
      "Я тебе люблю",
      "愛してる"
    ];

    const COLORS = [
      "rgba(245, 238, 255, 0.92)",
      "rgba(218, 195, 255, 0.85)",
      "rgba(186, 150, 255, 0.78)",
      "rgba(155, 115, 250, 0.70)",
      "rgba(255, 255, 255, 0.95)"
    ];

    const DURATION = 4500; // мс (анімація програється 1 раз)

    function isInHeart(nx, ny) {
      const x = nx * 1.04;
      const y = (ny + 0.16) * 1.04;
      return (x * x + Math.pow(y - Math.pow(x * x, 1 / 3), 2)) <= 1.0;
    }

    function createRng(seed = 1337) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    const SIZE = 1000;
    const CX = SIZE * 0.5;
    const CY = SIZE * 0.52;
    const SCALE_X = SIZE * 0.38;
    const SCALE_Y = SIZE * 0.38;

    const rng = createRng(1337);
    const items = [];

    // Генеруємо багато щільних шарів дрібного тексту, щоб утворити суцільне серце
    const TOTAL_ITEMS = 2400;
    let attempts = 0;

    while (items.length < TOTAL_ITEMS && attempts < 35000) {
      attempts++;
      const text = PHRASES[Math.floor(rng() * PHRASES.length)];
      const color = COLORS[Math.floor(rng() * COLORS.length)];
      const fontSize = Math.floor(8 + rng() * 5); // 8..12 px на полотні 1000x1000

      // Випадкова точка всередині контуру серця (з легкою рваністю по краях, як на відео)
      const rx = (rng() * 2.24 - 1.12);
      const ry = (rng() * 2.24 - 1.12);
      if (!isInHeart(rx, ry)) continue;

      const px = CX + rx * SCALE_X - fontSize * 2.2;
      const py = CY - ry * SCALE_Y - fontSize * 0.5;

      // Перевіряємо, щоб правий край фрази не вилазив далеко за контур
      const approxW = text.length * fontSize * 0.58;
      const rxRight = (px + approxW - CX) / SCALE_X;
      if (!isInHeart(rxRight, ry) && rng() > 0.35) continue;

      const angle = (Math.atan2(-ry, rx) + Math.PI) / (Math.PI * 2);
      const dist = Math.hypot(rx, ry);
      const isEdge = dist > 0.72;

      // Спочатку промальовується зовнішній контур, потім заповнюється середина
      const orderKey = isEdge
        ? angle * 0.45 + rng() * 0.06
        : 0.45 + (1 - dist) * 0.45 + rng() * 0.1;

      items.push({ x: px, y: py, text, color, fontSize, orderKey });
    }

    items.sort((a, b) => a.orderKey - b.orderKey);

    // Попередньо малюємо підкладку світіння (glow) по формі серця для високого FPS на телефоні
    const glowCanvas = document.createElement("canvas");
    glowCanvas.width = SIZE;
    glowCanvas.height = SIZE;
    const gCtx = glowCanvas.getContext("2d");

    gCtx.save();
    gCtx.filter = "blur(26px)";
    gCtx.fillStyle = "rgba(120, 75, 255, 0.85)";
    for (let i = 0; i < items.length; i += 3) {
      const it = items[i];
      gCtx.fillRect(it.x, it.y, it.text.length * it.fontSize * 0.55, it.fontSize);
    }
    gCtx.restore();

    // Зберігаємо вже відмальовані кадри на окремий шар, щоб не перемальовувати 2400 рядків щоразу
    const textCanvas = document.createElement("canvas");
    textCanvas.width = SIZE;
    textCanvas.height = SIZE;
    const tCtx = textCanvas.getContext("2d");
    tCtx.textBaseline = "top";
    tCtx.shadowColor = "rgba(155, 110, 255, 0.75)";
    tCtx.shadowBlur = 6;

    let drawnCount = 0;
    const startTime = performance.now();

    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / DURATION);
      const targetCount = Math.floor(progress * items.length);

      // Домальовуємо тільки нові фрази, які з'явилися на цьому кадрі
      while (drawnCount < targetCount) {
        const it = items[drawnCount];
        tCtx.font = `600 ${it.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif`;
        tCtx.fillStyle = it.color;
        tCtx.fillText(it.text, it.x, it.y);
        drawnCount++;
      }

      ctx.fillStyle = "#04030a";
      ctx.fillRect(0, 0, SIZE, SIZE);

      // М'яке неонове світіння навколо серця
      ctx.save();
      ctx.globalAlpha = 0.25 + 0.75 * progress;
      ctx.drawImage(glowCanvas, 0, 0);
      ctx.restore();

      // Шар з текстом
      ctx.drawImage(textCanvas, 0, 0);

      if (progress < 1) {
        requestAnimationFrame(animate);
      }
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
