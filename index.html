<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #05040c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    canvas {
      width: min(94vw, 94vh);
      height: min(94vw, 94vh);
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const PHRASES = [
      "I love you",
      "Я тебе люблю",
      "愛してる"
    ];

    const COLORS = [
      "#e8dcff",
      "#cbb2ff",
      "#b08cff",
      "#f2ebff"
    ];

    const DURATION = 4200; // мс (1 прохід)

    function isInHeart(nx, ny) {
      const x = nx * 1.05;
      const y = (ny + 0.16) * 1.05;
      return (x * x + Math.pow(y - Math.pow(x * x, 1 / 3), 2)) <= 1.0;
    }

    function createRng(seed = 42) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    function setupAndAnimate() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const size = Math.min(window.innerWidth * 0.94, window.innerHeight * 0.94, 900);
      canvas.width = Math.floor(size * dpr);
      canvas.height = Math.floor(size * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const cx = size * 0.5;
      const cy = size * 0.52;
      const scaleX = size * 0.36;
      const scaleY = size * 0.36;

      const rng = createRng(42);
      const fontSize = Math.max(10, Math.round(size * 0.015));
      ctx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif`;
      ctx.textBaseline = "top";

      const items = [];
      let attempts = 0;
      const targetCount = Math.min(460, Math.floor(size * 0.52));

      while (items.length < targetCount && attempts < 10000) {
        attempts++;
        const text = PHRASES[Math.floor(rng() * PHRASES.length)];
        const color = COLORS[Math.floor(rng() * COLORS.length)];
        const w = ctx.measureText(text).width;
        const h = fontSize * 1.2;

        const px = cx + (rng() * 2.3 - 1.15) * scaleX;
        const py = cy + (rng() * 2.3 - 1.15) * scaleY;

        const nx = (px + w * 0.5 - cx) / scaleX;
        const ny = (cy - (py + h * 0.5)) / scaleY;
        if (!isInHeart(nx, ny)) continue;

        let overlap = false;
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          if (Math.abs(px - it.x) < (w + it.w) * 0.42 && Math.abs(py - it.y) < (h + it.h) * 0.72) {
            overlap = true;
            break;
          }
        }
        if (overlap) continue;

        const angle = (Math.atan2(py - cy, px - cx) + Math.PI) / (Math.PI * 2);
        const dist = Math.hypot((px + w * 0.5 - cx) / scaleX, (py + h * 0.5 - cy) / scaleY);
        const isEdge = dist > 0.68;
        const orderKey = isEdge
          ? angle * 0.55
          : 0.55 + dist * 0.45 + (rng() - 0.5) * 0.08;

        items.push({ x: px, y: py, w, h, text, color, orderKey });
      }

      items.sort((a, b) => a.orderKey - b.orderKey);

      const startTime = performance.now();

      function frame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / DURATION);
        const visibleCount = Math.floor(progress * items.length);

        ctx.fillStyle = "#05040c";
        ctx.fillRect(0, 0, size, size);

        if (visibleCount > 0) {
          ctx.save();
          ctx.shadowColor = `rgba(125, 80, 255, ${0.85 * progress})`;
          ctx.shadowBlur = Math.max(18, size * 0.055);
          ctx.fillStyle = `rgba(110, 68, 240, ${0.22 * progress})`;

          for (let i = 0; i < visibleCount; i++) {
            const it = items[i];
            ctx.fillRect(it.x - 2, it.y, it.w + 4, it.h * 0.85);
          }
          ctx.restore();

          ctx.save();
          ctx.shadowColor = "#9d6bff";
          ctx.shadowBlur = Math.max(8, size * 0.02);
          for (let i = 0; i < visibleCount; i++) {
            const it = items[i];
            ctx.fillStyle = it.color;
            ctx.fillText(it.text, it.x, it.y);
          }
          ctx.restore();
        }

        if (elapsed < DURATION + 1200) {
          requestAnimationFrame(frame);
        }
      }

      requestAnimationFrame(frame);
    }

    setupAndAnimate();
    window.addEventListener("resize", setupAndAnimate);
  </script>
</body>
</html>
